name: Verify observatory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app dashboard
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker build -t biotech-observatory:test .
      - run: docker run --rm biotech-observatory:test python -m app.main init
      - run: docker run --rm -v "$PWD/tests:/tests:ro" biotech-observatory:test python -m unittest discover -s /tests -p test_dashboard.py -v
